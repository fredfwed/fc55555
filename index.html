<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fredyc.com</title>
  

  <style>
    body {
      margin: 0;
      background-color: rgb(255, 255, 255);
    }

    .centered-text {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: "Times New Roman", serif;
      font-size: 48px;
      text-align: center;
      line-height: 1.2;
    }

    .updated {
      position: fixed;
      top: 10px;
      left: 10px;
      color: rgb(0, 0, 0);
      font-family: "Times New Roman", serif;
      font-size: 16px;
    }

    #counter {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: rgb(0, 0, 0);
      font-family: "Times New Roman", serif;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <

  <div class="updated">
   <div> Last Updated 5/23/2026 </div>
    <div> Discord: @fc01857</div>
   <div id="counter"></div>

  <!-- GoatCounter visitor counter -->
  <script>
    var t = setInterval(function () {
      if (window.goatcounter && window.goatcounter.visit_count) {
        clearInterval(t);

        window.goatcounter.visit_count({
          append: "#counter"
        });
      }
    }, 100);
  </script>

  <script
    data-goatcounter="https://fredyc.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js">
  </script>

</body>
</html>
